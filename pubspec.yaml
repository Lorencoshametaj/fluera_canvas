name: fluera_canvas
description: >
  Document-grade infinite-canvas SDK for Flutter — layered scene graph,
  selection + transform, lasso, image annotations, text, keyboard shortcuts.
version: 0.16.2
homepage: https://engine.fluera.dev
repository: https://github.com/Lorencoshametaj/fluera_canvas
issue_tracker: https://github.com/Lorencoshametaj/fluera_canvas/issues
documentation: https://pub.dev/documentation/fluera_canvas/latest/
topics:
  - canvas
  - whiteboard
  - infinite-canvas
  - notes
  - graphics

screenshots:
  - description: 'Selection with snap-to-grid and magenta smart guides on an infinite canvas.'
    path: screenshots/01-selection.png
  - description: 'Multi-layer scene with Material 3 toolbar, palette and opacity slider.'
    path: screenshots/02-layers.png
  - description: 'Zero-config FlueraSketchApp — restyled Material 3 toolbar full-frame.'
    path: screenshots/03-toolbar.png

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Cross-platform native file picker (Verified Publisher Flutter).
  # Pulled only by `CanvasTool.image` / `showImageTool`. The free
  # widget tree never touches it unless the consumer wires the image
  # tool in.
  file_selector: ^1.1.0
  meta: ^1.11.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
