name: fluera_canvas
description: >
  Pressure-sensitive infinite-canvas SDK for Flutter. Pen / eraser, undo /
  redo, drop-in toolbar, persistence (PNG / JSON / binary), 5k+ strokes
  at 60 FPS.
version: 0.3.0
homepage: https://engine.fluera.dev
repository: https://github.com/Lorencoshametaj/fluera_canvas
issue_tracker: https://github.com/Lorencoshametaj/fluera_canvas/issues
topics:
  - canvas
  - drawing
  - 2d-engine
  - graphics
  - scene-graph

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
