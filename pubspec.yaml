name: fluera_canvas
description: >
  Document-grade infinite-canvas SDK for Flutter. Built for notes apps,
  whiteboards and design tools — not signature pads. Multi-thousand
  strokes at 60 FPS, drop-in toolbar, native GPU bridge.
version: 0.7.0
homepage: https://engine.fluera.dev
repository: https://github.com/Lorencoshametaj/fluera_canvas
issue_tracker: https://github.com/Lorencoshametaj/fluera_canvas/issues
topics:
  - canvas
  - whiteboard
  - infinite-canvas
  - notes
  - graphics

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Cross-platform native file picker (Verified Publisher Flutter).
  # Pulled only by `CanvasTool.image` / `showImageTool`. The free
  # widget tree never touches it unless the consumer wires the image
  # tool in.
  file_selector: ^1.1.0
  meta: ^1.11.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
