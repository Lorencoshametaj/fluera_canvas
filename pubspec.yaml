name: fluera_canvas
description: >
  A professional 2D canvas SDK for Flutter. Pressure-sensitive infinite
  canvas with a native GPU live-stroke pipeline (Vulkan / Metal / OpenGL /
  Direct3D 11 / WebGPU), scene graph, and pluggable brush engines.
version: 0.1.0
homepage: https://fluera.dev
repository: https://github.com/Lorencoshametaj/fluera_canvas
issue_tracker: https://github.com/Lorencoshametaj/fluera_canvas/issues
topics:
  - canvas
  - drawing
  - 2d-engine
  - graphics
  - scene-graph

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  meta: ^1.11.0
  vector_math: ^2.1.4
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Plugin platform declarations are added in Ondata 6 once native code
# (Vulkan / Metal / GL / D3D11) is migrated over from fluera_engine. For now
# fluera_canvas is a pure-Dart package — native plumbing continues to ship
# via fluera_engine's plugin until the move.
