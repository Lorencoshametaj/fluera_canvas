include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: false
    strict-raw-types: false
  errors:
    unused_import: ignore         # cleanup pending during wave consolidation
    unnecessary_import: ignore
    unused_field: ignore          # legacy fields scheduled for removal post-split
    unused_element: ignore
    unused_local_variable: ignore
    unnecessary_getters_setters: ignore
    dangling_library_doc_comments: ignore
    unnecessary_this: ignore
    prefer_collection_literals: ignore
    prefer_conditional_assignment: ignore
    no_leading_underscores_for_local_identifiers: ignore

linter:
  rules:
    public_member_api_docs: false  # Enabled for pub.dev — exported symbols already documented.
    # NOTE: kept `false` for now because Dart's lint flags every public
    # member of every class (incl. constructors / fields), not just the
    # top-level types. The 5 top-level exports flagged at audit time
    # (0.10.0) have all been given a docstring; flipping this to `true`
    # would surface ~3000 hits on internal class members. Pana already
    # only checks top-level public symbols, so disabled-here doesn't
    # cost the score and keeps `flutter analyze` clean.
    avoid_print: true
