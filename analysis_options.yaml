include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: false
    strict-raw-types: false
  errors:
    unused_import: ignore         # cleanup pending during wave consolidation
    dangling_library_doc_comments: ignore

linter:
  rules:
    public_member_api_docs: false  # Enable before 1.0.0 for pub.dev score.
    avoid_print: true
